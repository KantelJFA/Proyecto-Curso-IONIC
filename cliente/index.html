<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main class="contenedor">
      <h1>Listado de canciones</h1>
      <!--p></p-->
      <section id="listado">
        <!--p id="dificultad"></p-->
        <table>
          <tr>
            <th class="Song_Title">Titulo</th>
            <th class="Song_Difficulty">Dificultad</th>
            <th class="Song_Score">Puntuación</th>
            <th class="Song_Grade">Grado</th>
            <th class="Song_State">Estado</th>
          </tr>
        </table>
        <button id="añade">Añade puntuación</button>
      </section>
      <section id="formulario">
        <form method="post">
          <select id="canciones">
            <option selected hidden>Seleccione una canción</option>
          </select><br>
          <label for="perfecto">Perfectos:</label>
          <input name="perfecto" type="number" id="perfecto"><br>
          <label for="bien">Bien:</label>
          <input name="bien" type="number" id="bien"><br>
          <label for="fallo">Fallos:</label>
          <input name="fallo" type="number" id="fallo"><br>
          <input type="submit" value="Añadir puntuación">
        </form>
        <button id="muestra">Ver lista</button>
      </section>
    </main>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
